name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Setup Godot and Android
        run: |
          mkdir -p ~/.local/share/godot/export_templates ~/.config/godot
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/ 2>/dev/null || true

          SDK=/usr/lib/android-sdk
          SDKM=$(find / -name sdkmanager -type f 2>/dev/null | head -n 1)
          echo "sdkmanager: $SDKM"
          yes | $SDKM --sdk_root=$SDK --licenses > /dev/null || true
          $SDKM --sdk_root=$SDK "build-tools;34.0.0" "platforms;android-34"

          JAVA=$(dirname $(dirname $(readlink -f $(which javac))))
          echo "java: $JAVA"

          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
            -keystore debug.keystore -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          mv debug.keystore /root/debug.keystore

          godot --headless --import || true

          cat > ~/.config/godot/editor_settings-4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$SDK"
          export/android/java_sdk_path = "$JAVA"
          export/android/debug_keystore = "/root/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          export/android/shutdown_adb_on_exit = true
          EOF
          cp ~/.config/godot/editor_settings-4.tres ~/.config/godot/editor_settings-4.3.tres

      - name: Export APK
        run: |
          mkdir -p build
          godot --headless --verbose --export-debug "Android" build/neon-district.apk

      - uses: actions/upload-artifact@v4
        with:
          name: neon-district-apk
          path: build/neon-district.apk
